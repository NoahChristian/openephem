name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.12"
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Installing proves the wheel builds and deps resolve. Tests are offline +
      # data-free (swisseph exactness tests skip automatically when pyswisseph is
      # absent, which it is here — this project is MIT only).
      - name: Install openephem + test deps
        run: python -m pip install ".[test]"

      - name: Lint (ruff)
        run: python -m ruff check src/openephem

      - name: Type-check (mypy)
        run: python -m mypy

      - name: Tests + coverage gate (>=85% of the pure-computation core)
        run: python -m pytest --cov=openephem --cov-report=term-missing -q
